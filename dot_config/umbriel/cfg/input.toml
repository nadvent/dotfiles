# ==============================================================================
# Umbriel Input Configuration
# https://docs.noctalia.dev/umbriel/input/
# ==============================================================================

# Enable NumLock when a physical keyboard connects.
[input.keyboard]
numlock_toggle = true

# Focus can follow the pointer across tiled, floating, and pinned windows.
[input.focus]
follows_mouse = "off" # "off", "sloppy", or "always"; always also refocuses after layout and workspace changes.
# hover_raises = false # Hover focuses only; clicks and keybinds raise.

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"
