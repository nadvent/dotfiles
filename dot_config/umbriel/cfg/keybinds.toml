# ==============================================================================
# Umbriel Keybinds Configuration
#
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax:  https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
# ==============================================================================

[keybinds]

# Applications and session
"Mod+Shift+Return" = { action = "spawn:ghostty", repeat = false }
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
# "Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
# "Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
# "Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
# Needs layout.mode = "dwindle".
# "Mod+Alt+T" = "layout-toggle-split"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+N" = "scratchpad-toggle:notes" 
"Mod+M" = "scratchpad-toggle:music"
"Mod+Space" = "scratchpad-toggle:Quick Search"
"Mod+Return" = "scratchpad-toggle:terminal"
"Mod+Escape" = "spawn:escape-scratchpad"

# Applications ported from Niri
"Mod+B" = { action = "spawn:zen", repeat = false }
"Mod+Shift+E" = { action = "spawn:zeditor", repeat = false }
"Mod+E" = { action = "spawn:nautilus", repeat = false }

# Noctalia shell keybinds ported from Niri
"Mod+Shift+W" = { action = "spawn:noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+S" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+S" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
# "Mod+Alt+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+Shift+Q" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+V" = { action = "spawn:noctalia msg panel-toggle tiobaka/vm-manager:manager", repeat = false }

# Additional media controls ported from Niri
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media stop", allow_when_locked = true, repeat = false }

# Window movement and focus ported from Niri
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+J" = "window-move-down"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"

"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"
"Mod+Ctrl+Shift+Up" = "column-move-to-output-up"
"Mod+Ctrl+Shift+Down" = "column-move-to-output-down"

"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"

"Mod+C" = "column-center"
"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.1"
"Mod+Ctrl+Shift+R" = "window-cycle-secondary-extent"
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }

# Workspaces: Move columns ported from Niri
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"

# Screenshots ported from Niri
"Ctrl+Shift+1" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Ctrl+Shift+2" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Shift+3" = { action = "spawn:noctalia msg screenshot-annotate", repeat = false }

# Power and Session ported from Niri
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"

# Scripts
"Mod+F12" = { action = "spawn:${XDG_BIN_HOME:-$HOME/.local/bin}/toggle-audio.sh", repeat = false }
