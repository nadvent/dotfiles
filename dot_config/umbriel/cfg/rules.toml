# ==============================================================================
# Umbriel Rules Configuration
# Window rules: https://docs.noctalia.dev/umbriel/window-rules/
# Layer rules:  https://docs.noctalia.dev/umbriel/layer-rules/
#
# Rules combine in order, with later values overriding earlier ones.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Window Rules
# ------------------------------------------------------------------------------

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = false

# Give scratchpad windows their own border colors.
[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#E5C07BFF"
border_color_unfocused = "#5C4A2AFF"

# ------------------------------------------------------------------------------
# Application Window Rules
# ------------------------------------------------------------------------------

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
[[window_rule]]
match.app_id = "^steam_app_.*$"
confine_pointer = true

# Keep an application drawing while it is hidden on another workspace, for programs whose other work stalls without it.
[[window_rule]]
match.app_id = "^obs$"
background_render = true

[[window_rule]]
match.app_id = "^astra$"
default_scratchpad = "music"

[[window_rule]]
match.app_id = '^(obsidian|md\.obsidian\.Obsidian)$'
default_scratchpad = "notes"
default_scrolling_extent = 0.4
default_floating_size = { width = 0.4, height = 1.0 }
default_position = { x = 0, y = 0, anchor = "left" }

[[window_rule]]
match.app_id = '^(ghostty-scratchpad|com\.mitchellh\.ghostty\.scratchpad)$'
default_floating = true
default_floating_size_px = { width = 1150, height = 750 }
default_scratchpad = "terminal"

[[window_rule]]
match.app_id = "^qutebrowser-scratchpad$"
default_floating = true
default_floating_size_px = { width = 1150, height = 750 }
default_scratchpad = "Quick Search"

[[window_rule]]
match.app_id = "^org\\.yazi\\.file_chooser$"
default_floating = true
default_floating_size_px = { width = 1050, height = 680 }

[[window_rule]]
match.title = "^Yazi:"
default_floating = true
default_floating_size_px = { width = 1050, height = 680 }

[[window_rule]]
match.app_id = "^neovide$"
blur = true

# [[window_rule]]
# match.app_id = "^com.mitchellh.ghostty$"
# opacity = 0.70

# Leave an application that draws its own corners and shadow undecorated.
# [[window_rule]]
# match.app_id = "^org[.]gnome[.]TextEditor$"
# border_width = 0
# corner_radius = 0
# shadow = false

# ------------------------------------------------------------------------------
# Layer Rules
# ------------------------------------------------------------------------------

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false
