# ==============================================================================
# Umbriel Rules Configuration
# Window rules: https://docs.noctalia.dev/umbriel/window-rules/
# Layer rules:  https://docs.noctalia.dev/umbriel/layer-rules/
#
# Rules combine in order, with later values overriding earlier ones.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Window Rules
# ------------------------------------------------------------------------------

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = false


# ------------------------------------------------------------------------------
# System & Utility Dialogs
# ------------------------------------------------------------------------------

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
[[window_rule]]
match.app_id = "^steam_app_.*$"
confine_pointer = true

# Keep an application drawing while it is hidden on another workspace.
[[window_rule]]
match.app_id = "^obs$"
background_render = true

[[window_rule]]
match.app_id = "^org\\.yazi\\.file_chooser$"
default_floating = true
default_floating_size_px = { width = 1050, height = 680 }

[[window_rule]]
match.title = "^Yazi:"
default_floating = true
default_floating_size_px = { width = 1050, height = 680 }


# ------------------------------------------------------------------------------
# Core Applications & Layout Sizing
# Primary display base layer usable height is 1150 px (1200 - 34 bar - 16 gaps).
# Available horizontal span between gaps is 2117 px (2133 - 16 gaps).
# ------------------------------------------------------------------------------

# Ghostty Terminal:
# Sized to roughly A4 aspect ratio (210/297 = 0.707) not including statuscolumn.
# At 1150px height: A4 text body is ~813px. Adding Neovim statuscolumn (~40px)
# gives exactly 853px (which equals 0.40 / 40% of the 2133px display width).
[[window_rule]]
match.app_id = "^com\\.mitchellh\\.ghostty$"
default_scrolling_extent = 0.43
default_scrolling_extent_px = 853
default_floating_size_px = { width = 853, height = 1150 }

# Neovide (GUI Neovim client)
[[window_rule]]
match.app_id = "^neovide$"
blur = true
default_scrolling_extent = 0.43
default_scrolling_extent_px = 853
default_floating_size_px = { width = 853, height = 1150 }

# Zen Browser:
# Sized to 60% of display width (1280px, perfectly complementing Ghostty's 40%
# so both can sit side-by-side without overflowing the 2133px display).
[[window_rule]]
match.app_id = "^zen$"
default_scrolling_extent = 0.60
default_scrolling_extent_px = 1280

# Zathura Document Viewer:
# Sized to exact A4 aspect ratio (210/297 = 0.7071).
# At base layer height of 1150px, pure A4 document width is 813px (~0.38 extent).
[[window_rule]]
match.app_id = '^(org\.pwmt\.zathura|zathura)$'
default_scrolling_extent = 0.38
default_scrolling_extent_px = 813
default_floating_size_px = { width = 1018, height = 1150 }


# ------------------------------------------------------------------------------
# Scratchpads
# Sidebars anchor at top_left { x = 8, y = 8 }, aligning with y=42 and height 1150
# to seamlessly match the base layer tiled windows and outer 8px gaps.
# ------------------------------------------------------------------------------

# Music Scratchpad (rmpc)
[[window_rule]]
match.app_id = '^(rmpc|com\.mitchellh\.ghostty\.rmpc)$'
default_floating = true
default_floating_size_px = { width = 600, height = 1150 }
default_position = { x = 8, y = 8, anchor = "top_left" }
default_scratchpad = "music"

[[window_rule]]
match.title = "^rmpc$"
default_floating = true
default_floating_size_px = { width = 600, height = 1150 }
default_position = { x = 8, y = 8, anchor = "top_left" }
default_scratchpad = "music"

# Notes Scratchpad (Obsidian)
# Sized to A4 width (853px / 0.40 extent) and full 1150px vertical height.
[[window_rule]]
match.app_id = '^(obsidian|md\.obsidian\.Obsidian)$'
default_scratchpad = "notes"
default_scrolling_extent = 0.43
default_floating_size_px = { width = 853, height = 1150 }
default_position = { x = 8, y = 8, anchor = "top_left" }

# Terminal Scratchpad (Ghostty scratchpad)
[[window_rule]]
match.app_id = '^(ghostty-scratchpad|com\.mitchellh\.ghostty\.scratchpad)$'
default_floating = true
default_floating_size_px = { width = 1150, height = 750 }
default_scratchpad = "terminal"

# Quick Search Scratchpad (Qutebrowser)
[[window_rule]]
match.app_id = "^qutebrowser-scratchpad$"
default_floating = true
default_floating_size_px = { width = 1280, height = 800 }
default_scratchpad = "Quick Search"


# ------------------------------------------------------------------------------
# Layer Rules
# ------------------------------------------------------------------------------

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false
