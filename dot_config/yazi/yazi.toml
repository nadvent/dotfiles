# ==============================================================================
# Yazi Configuration (yazi.toml)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Previewers
# ------------------------------------------------------------------------------
[plugin]
prepend_previewers = [
  # Markdown preview with glow via piper
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },

  # Archives preview with ouch
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*,java-archive}", run = "ouch" },
  { url = "*.{zip,tar,tar.gz,tgz,tar.bz2,tbz2,tar.xz,txz,tar.zst,tzst,7z,rar}", run = "ouch" },
]

# ------------------------------------------------------------------------------
# 2. Openers
# ------------------------------------------------------------------------------
[opener]
edit = [
  { run = "sh -c '${EDITOR:-nvim} \"$@\"' -- %s", block = true, desc = "$EDITOR", for = "unix" },
]
extract = [
  { run = 'ouch d -y %s', desc = "Extract with ouch", for = "unix" },
  { run = 'ouch d -y --here %s', desc = "Extract here with ouch", for = "unix" },
]

# ------------------------------------------------------------------------------
# 3. Open Rules
# ------------------------------------------------------------------------------
[open]
prepend_rules = [
  # Trash rules
  { mime = "trash/**", use = [ "trash" ] },

  # Compressed archives (ouch)
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*,java-archive}", use = [ "extract", "reveal" ] },
  { url = "*.{zip,tar,tar.gz,tgz,tar.bz2,tbz2,tar.xz,txz,tar.zst,tzst,7z,rar}", use = [ "extract", "reveal" ] },

  # Plain text files
  { mime = "text/*", use = [ "edit", "open" ] },

  # Data, config, and script formats
  { mime = "application/{json,ndjson,javascript,typescript,xml,yaml,toml,x-yaml,x-toml,x-sh,x-shellscript,csv,x-subrip,wine-extension-ini,x-desktop}", use = [ "edit", "open" ] },

  # Empty files
  { mime = "inode/empty", use = [ "edit", "open" ] },
]
