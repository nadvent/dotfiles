# Ghostty configuration optimized for the rmpc vertical scratchpad
# Loaded via scripts/launch_rmpc.sh on top of the default Ghostty config

class = com.mitchellh.ghostty.rmpc
title = "rmpc"
gtk-single-instance = false

# Hide window decorations, GTK titlebar, and tab bar/names
window-decoration = none
gtk-titlebar = false
gtk-tabs-location = hidden
gtk-wide-tabs = false

# Rosé Pine Dawn base matching themes/scratchpad.ron (prevents dark flash on open)
background = #faf4ed
foreground = #575279
window-padding-x = 4
window-padding-y = 4
window-padding-balance = true
window-padding-color = extend

# Optimized for rmpc TUI + Kitty/album-art graphics without shell overhead
scrollback-limit-bytes = 0
image-storage-limit = 16000000
shell-integration = none
confirm-close-surface = false
mouse-hide-while-typing = true
